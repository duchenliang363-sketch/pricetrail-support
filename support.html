  <main>
    <h1>价迹</h1>
    <p>价迹是一款在 iPhone 本机运行的价格记录工具：记住每一次真实价格，下次不用再翻聊天记录。搜型号，3 秒看到自己的历史价格。</p>

    <h2>如何使用</h2>
    <ol>
      <li>打开 App，点击右下角【+ 记价格】</li>
      <li>填写商品/型号和价格（必填），对象、日期、备注可选</li>
      <li>回到首页搜索型号，即可看到该商品的全部价格历史（最近价、最低价、最高价、记录次数）</li>
    </ol>

    <h2>数据说明</h2>
    <p>所有数据仅保存在你的 iPhone 本地，无需注册、无需联网，不收集任何个人信息。</p>
